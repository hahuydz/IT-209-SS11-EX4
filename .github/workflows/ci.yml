name: Java Spring Boot CI (Container Registry Login)

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-login:
    name: Run Unit Tests and Login GHCR
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Tạo các tệp cấu hình Gradle giả lập cho Cache
        run: |
          mkdir -p gradle/wrapper
          echo "plugins { id 'java' }" > build.gradle
          echo "rootProject.name = 'demo'" > settings.gradle
          touch gradle/wrapper/gradle-wrapper.properties

      - name: Thiết lập môi trường Java JDK 17 và bật Gradle Cache
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Đăng nhập vào GitHub Container Registry (GHCR) bằng Token tự động
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Xác nhận đăng nhập thành công
        run: echo "Đăng nhập GHCR thành công rực rỡ!"
