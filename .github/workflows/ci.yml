name: Java Spring Boot CI (Container Registry Login)

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-login:
    name: Run Unit Tests and Login GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Thiết lập môi trường Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Đăng nhập vào GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Xác nhận đăng nhập thành công
        run: echo "Đăng nhập GHCR thành công với Secret REGISTRY_TOKEN!"
